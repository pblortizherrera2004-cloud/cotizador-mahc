<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cotización MAHC SpA</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9ebf2;--ink:#111;--muted:#555;--line:#d9dce6;--navy:#2b3590;--brand:#5a55d6;--red:#c0281d;--paper:#fff;
--f:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f1a}}
:root[data-theme="dark"]{--bg:#0d0f1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:var(--f);color:var(--ink);font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;background:var(--navy)}
.bar span{margin-right:auto;color:#fff;font:700 15px var(--f)}
button{font:500 13px var(--f);border:0;border-radius:6px;padding:9px 14px;cursor:pointer;background:#fff;color:var(--navy)}
button.sec{background:#3d49b0;color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.paper{max-width:860px;margin:16px auto;background:var(--paper);color:var(--ink);box-shadow:0 2px 18px rgba(0,0,0,.2);border-top:7px solid var(--navy);padding:0 0 28px}
.head{padding:0 28px}
.head img{display:block;width:120px;height:120px}
.co{font:400 26px/1.3 var(--f);color:var(--brand);margin:8px 0 2px;outline:none}
.sm{font-size:13px;color:var(--muted);line-height:1.5;outline:none}
h1{margin:26px 28px 14px}
input,textarea{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-bottom:1px dashed var(--line);border-radius:2px;padding:5px 4px;width:100%}
input:hover{background:#f3f4fa}
input:focus{background:#fff;border-color:var(--brand)}
#titulo{font:900 34px/1.15 var(--f);color:var(--navy);border-bottom:0}
.blk{padding:0 28px;margin-top:18px}
.blk b{display:block;font-weight:700;font-size:15px}
.blk input{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.fecha{max-width:200px}
.tbl{padding:0 28px;margin-top:26px}
.row{display:grid;grid-template-columns:1fr 90px 130px 130px 28px;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding:3px 0}
.row.h{border-bottom:2px solid var(--navy);color:var(--navy);font-weight:500;font-size:15px;padding-bottom:6px}
.row input.d{font-weight:700}
.row .n{text-align:right}
.row input.n{font-weight:700}
.t{text-align:right;font-weight:700;padding-right:4px;font-variant-numeric:tabular-nums}
.del{background:none;color:var(--red);padding:2px 6px;font-size:20px;line-height:1}
.add{margin-top:12px;background:var(--navy);color:#fff}
.tot{margin:26px 28px 0 auto;max-width:400px}
.tot div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tot span.l{color:var(--navy);font-size:13px}
.tot b{font-weight:700}
.tot input{width:130px;text-align:right;font-weight:700}
.tot input.pct{width:56px}
.tot .red .l{color:var(--red)}
.tot .grand{border:0;margin-top:8px;align-items:baseline}
.tot .grand .l{color:var(--red);font-size:16px}
.tot .grand b{color:var(--red);font-size:22px;font-weight:700}
@media (max-width:620px){
 .head,.blk,.tbl{padding:0 16px}h1{margin:20px 16px 10px}.tot{margin-right:16px;margin-left:16px;max-width:none}
 #titulo{font-size:26px}.two{grid-template-columns:1fr;gap:14px}
 .row.h{display:none}
 .row{grid-template-columns:1fr 1fr 28px;grid-template-areas:"d d d" "q p x" "t t t";padding:8px 0}
 .row .d{grid-area:d}.row .q{grid-area:q}.row .p{grid-area:p}.row .t{grid-area:t}.row .del{grid-area:x}
 .row .t::before{content:"Precio total: ";color:var(--navy);font-weight:400}
}
@media print{
 :root{padding:0}body{background:#fff}body::before,.bar,.del,.add{display:none!important}
 .paper{margin:0;box-shadow:none;max-width:none}
 input{border:0!important;background:none!important;padding:2px 0}
 .paper,.row.h{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .row{break-inside:avoid}@page{margin:10mm}
}
</style>
<style>
:root{--ink:#14183a;--tint:#f5f6fc;--bd:#e3e6f4}
body{background:linear-gradient(#e8ebf6,#dfe3f1) fixed}
.paper{border-top:0;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(20,30,90,.18);padding-bottom:32px}
.head{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i c" "i s";column-gap:22px;align-items:center;padding:28px;background:linear-gradient(120deg,#0a1240,#2b3590);border-bottom:4px solid var(--brand)}
.head img{grid-area:i;width:96px;height:96px;border-radius:18px;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.co{grid-area:c;color:#fff;font:800 30px/1.1 var(--f);margin:0 0 6px;align-self:end}
.sm{grid-area:s;color:#c5ccff;align-self:start}
h1{margin:26px 28px 6px}
#titulo{font:700 30px/1.2 var(--f);letter-spacing:-.01em;color:var(--navy);border-bottom:2px solid var(--bd);padding:6px 4px}
#titulo::placeholder{color:#b4b9d6}
.blk{margin:16px 28px 0;padding:14px 16px;background:var(--tint);border:1px solid var(--bd);border-radius:10px}
.blk b{font:600 12px var(--f);color:var(--brand);letter-spacing:.03em;margin-bottom:4px}
.blk input{font-size:14px;color:var(--ink)}
.fecha{max-width:220px}
.two{display:block}
input{border:1px solid transparent;border-radius:6px}
input:hover{background:#fff;border-color:var(--bd)}
input:focus{background:#fff;border-color:var(--brand);box-shadow:0 0 0 3px rgba(90,85,214,.15)}
.row{padding:7px 12px;border-bottom:1px solid var(--bd)}
#items .row:nth-child(even){background:#f8f9fe}
.row.h{background:var(--navy);color:#fff;border:0;border-radius:8px 8px 0 0;padding:11px 12px;font:500 13px var(--f)}
.add{width:100%;margin-top:14px;background:transparent;color:var(--brand);border:1.5px dashed var(--brand);padding:12px}
.add:hover{background:var(--tint)}
.tot{margin:28px 28px 0 auto;max-width:400px;padding:12px 20px;background:var(--tint);border:1px solid var(--bd);border-radius:14px}
.tot div{border-bottom-color:var(--bd)}
.tot input{border:1px solid var(--bd);background:#fff}
.tot .grand{background:#fff;border:1px solid #f1c6c1;border-radius:10px;padding:12px 16px;margin:10px 0 4px}
@media (max-width:620px){
.head{padding:20px;column-gap:14px}.head img{width:68px;height:68px;border-radius:14px}.co{font-size:22px}
h1{margin:20px 16px 4px}#titulo{font-size:24px}
.blk{margin:14px 16px 0}.fecha{max-width:none}
.tot{margin:22px 16px 0;max-width:none}
#items .row{border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;background:#fff;padding:10px 8px}
}
</style>
</head>

 <h1><input id="titulo" placeholder="Título de la cotización" aria-label="Título"></h1>

 <div class="blk fecha"><b>Fecha</b><input id="fecha" type="date"></div>

 <div class="blk two">
  <div><b>Proveedor</b>
   <input value="Marcelo Hormazabal C." aria-label="Nombre proveedor">
   <input value="MAHC SpA" aria-label="Empresa">
   <input value="Santiago, RM" aria-label="Ciudad">
  </div>
 </div>

 <section class="tbl">
  <div class="row h"><span>Descripción</span><span class="n">Cantidad</span><span class="n">Precio unitario</span><span class="n">Precio total</span><span></span></div>
  <div id="items"></div>
  <button class="add" onclick="addItem()">+ Agregar producto</button>
 </section>

 <section class="tot">
  <div><span class="l">Subtotal</span><b id="sub">$0</b></div>
  <div><span class="l">Mano de Obra</span><input id="mo" type="number" min="0" value="0" placeholder="0"></div>
  <div><span class="l">Traslado Materiales</span><input id="tr" type="number" min="0" value="0" placeholder="0"></div>
  <div><span class="l">Neto</span><b id="neto">$0</b></div>
  <div><span class="l">IVA</span><span><input id="ivap" class="pct" type="number" min="0" value="19">%</span></div>
  <div class="red"><span class="l">Monto IVA</span><b id="iva">$0</b></div>
  <div class="grand"><span class="l">Total</span><b id="total">$0</b></div>
 </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const clp=n=>'$'+Math.round(n).toLocaleString('es-CL');
function addItem(){
  const r=document.createElement('div');r.className='row';
  r.innerHTML=`<input class="d" placeholder="Descripción" aria-label="Descripción">
  <input class="q n" type="number" min="0" step="any" placeholder="Cantidad" aria-label="Cantidad">
  <input class="p n" type="number" min="0" step="any" placeholder="Precio unitario" aria-label="Precio unitario">
  <span class="t">$0</span><button class="del" title="Quitar" aria-label="Quitar producto">×</button>`;
  r.querySelector('.del').onclick=()=>{if(document.querySelectorAll('#items .row').length>1){r.remove();calc()}else{r.querySelectorAll('input').forEach(i=>i.value='');calc()}};
  $('items').appendChild(r);calc();
}
function calc(){
  let sub=0;
  document.querySelectorAll('#items .row').forEach(r=>{
    const t=Math.round((+r.querySelector('.q').value||0)*(+r.querySelector('.p').value||0));
    r.querySelector('.t').textContent=clp(t);sub+=t;
  });
  const neto=sub+(+$('mo').value||0)+(+$('tr').value||0);
  const iva=Math.round(neto*(+$('ivap').value||0)/100);
  $('sub').textContent=clp(sub);$('neto').textContent=clp(neto);
  $('iva').textContent=clp(iva);$('total').textContent=clp(neto+iva);
}
function resetAll(){
  if(!confirm('¿Empezar una cotización nueva? Se borrarán los datos actuales.'))return;
  $('items').innerHTML='';addItem();
  $('titulo').value='';$('mo').value=0;$('tr').value=0;
  calc();
}
document.addEventListener('input',calc);
$('fecha').value=new Date().toISOString().slice(0,10);
addItem();

async function descargarPDF(){
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const W=210,M=16,R=W-M,H=297;
  const NAVY=[43,53,144],BRAND=[90,85,214],RED=[192,40,29],GRAY=[85,85,85],LINE=[217,220,230],BLACK=[17,17,17];
  const num=n=>(+n).toLocaleString('es-CL',{maximumFractionDigits:2});
  const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
  const font=(w,s,c)=>{doc.setFont('helvetica',w).setFontSize(s).setTextColor(...c)};
  doc.setFillColor(...NAVY);doc.rect(0,0,W,46,'F');
  doc.setFillColor(...BRAND);doc.rect(0,46,W,1.6,'F');
  doc.addImage(document.querySelector('.head img').src,'JPEG',M,8,30,30);
  let y=20;
  font('bold',20,[255,255,255]);doc.text(document.querySelector('.co').innerText.trim(),M+38,y);y+=7.5;
  font('normal',9.5,[197,204,255]);
  lines(document.querySelector('.sm').innerText).forEach(l=>{doc.text(l,M+38,y);y+=4.7});
  y=66;
  font('bold',24,NAVY);
  const tt=$('titulo').value.trim();
  const full=/^cotizaci[oó]n/i.test(tt)?tt:('Cotización'+(tt?' '+tt:''));
  const tl=doc.splitTextToSize(full,W-2*M);
  doc.text(tl,M,y);y+=tl.length*10+2;
  font('bold',11,BLACK);doc.text('Fecha',M,y);y+=5;
  font('normal',10,GRAY);doc.text($('fecha').value.split('-').reverse().join('/'),M,y);y+=10;
  font('bold',11,BLACK);doc.text('Proveedor',M,y);y+=5;
  font('normal',10,GRAY);
  document.querySelectorAll('.two input').forEach(i=>{if(i.value.trim()){doc.text(i.value.trim(),M,y);y+=4.8}});
  y+=8;
  const qtyR=128,unitR=160,descW=qtyR-M-24;
  const head=()=>{
    doc.setFillColor(...NAVY);doc.roundedRect(M,y-6,R-M,10,1.5,1.5,'F');
    font('bold',10,[255,255,255]);doc.text('Descripción',M+3,y);
    doc.text('Cantidad',qtyR,y,{align:'right'});doc.text('Precio unitario',unitR,y,{align:'right'});doc.text('Precio total',R-3,y,{align:'right'});y+=9;
  };
  head();let zi=0;
  document.querySelectorAll('#items .row').forEach(r=>{
    const d=r.querySelector('.d').value.trim(),q=r.querySelector('.q').value,p=r.querySelector('.p').value;
    if(!d&&!q&&!p)return;
    const dl2=doc.splitTextToSize(d,descW),h=dl2.length*4.6+4;
    if(y+h>H-22){doc.addPage();y=18;head()}
    if(zi++%2===0){doc.setFillColor(245,246,252);doc.rect(M,y-5,R-M,h,'F')}
    font('bold',9.5,BLACK);doc.text(dl2,M+3,y);
    doc.text(num(+q||0),qtyR,y,{align:'right'});
    doc.text(clp(+p||0),unitR,y,{align:'right'});
    doc.text(r.querySelector('.t').textContent,R-3,y,{align:'right'});
    doc.setDrawColor(...LINE).setLineWidth(0.2).line(M,y+h-5,R,y+h-5);y+=h;
  });
  if(y+80>H-12){doc.addPage();y=20}
  y+=8;
  const xL=108;
  [['Subtotal',$('sub').textContent],['Mano de Obra',clp(+$('mo').value||0)],['Traslado Materiales',clp(+$('tr').value||0)],['Neto',$('neto').textContent],['IVA',(+$('ivap').value||0)+'%'],['Monto IVA',$('iva').textContent]].forEach(([l,v],i)=>{
    font('normal',9.5,i==5?RED:NAVY);doc.text(l,xL+3,y);
    font('bold',9.5,BLACK);doc.text(v,R-3,y,{align:'right'});
    doc.setDrawColor(...LINE).setLineWidth(0.2).line(xL,y+2.4,R,y+2.4);y+=7;
  });
  y+=5;
  doc.setFillColor(255,244,243);doc.roundedRect(xL,y-7,R-xL,11,2,2,'F');
  font('normal',12,RED);doc.text('Total',xL+3,y);
  font('bold',15,RED);doc.text($('total').textContent,R-3,y,{align:'right'});
  const name=('Cotizacion'+($('titulo').value.trim()?' - '+$('titulo').value.trim():' MAHC SpA')).replace(/[\\/:*?"<>|]/g,'');
  doc.save(name+'.pdf');
}
</script>
